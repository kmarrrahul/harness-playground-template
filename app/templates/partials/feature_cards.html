<!-- ═══════════════════════════════════════════════════════════════════════
     FEATURE CARDS — Playground
══════════════════════════════════════════════════════════════════════════ -->

<!-- Section header with collapse toggle / focus-mode exit -->
<div class="flex items-center justify-between mb-3">
  <div class="flex items-center gap-3">
    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Features</span>
    <button x-show="focusMode" @click="exitFocus()"
            class="flex items-center gap-1 text-xs px-2 py-1 rounded bg-surface-700 hover:bg-surface-600 border border-surface-600 text-slate-300 transition-colors">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      Show all features
    </button>
  </div>
  <button x-show="!focusMode" @click="cardsVisible = !cardsVisible"
          class="flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-300 transition-colors px-2 py-1 rounded hover:bg-surface-700">
    <svg class="w-3.5 h-3.5 transition-transform duration-200" :class="cardsVisible ? '' : '-rotate-90'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
    <span x-text="cardsVisible ? 'Collapse' : 'Expand'"></span>
  </button>
</div>

<div x-show="cardsVisible"
     x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-2"
     class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8"
     :class="focusMode ? 'lg:grid-cols-1 sm:grid-cols-1' : ''">

  <!-- ── Card: Playground ─────────────────────────────────────────────── -->
  <div class="feature-card glass-card rounded-xl p-5 border border-surface-600 cursor-pointer transition-all duration-300"
       :class="{ 
         'ring-2 ring-brand-500 border-brand-500': activeFeature === 'playground',
         'lg:col-span-2': !focusMode 
       }"
       x-show="!focusMode || activeFeature === 'playground'"
       x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       @click="selectFeature('playground')">
    <div class="flex items-start justify-between gap-2 mb-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="icon-bg rounded-lg p-2.5 text-xl flex-shrink-0">🎮</div>
        <div class="min-w-0">
          <h3 class="font-semibold text-white flex flex-wrap items-center gap-1.5" :class="focusMode ? 'text-xl' : 'text-sm'">
            Playground
            <span title="Winner" class="inline-flex items-center justify-center px-1.5 py-0.5 rounded text-xs font-bold tracking-wide bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-[0_0_10px_rgba(99,102,241,0.5)] border border-indigo-400/50 whitespace-nowrap">
              🏆
            </span>
          </h3>
          <p class="text-slate-500 truncate" :class="focusMode ? 'text-sm mt-0.5' : 'text-xs'">Free-form agentic coding tasks</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <div class="relative" x-data>
          <button @click="toggleTemplates('playground', $event)"
                  class="rounded bg-surface-700/70 hover:bg-surface-600 text-slate-400 hover:text-slate-200 border border-surface-600 transition-colors flex items-center gap-1"
                  :class="focusMode ? 'text-sm px-3 py-1.5' : 'text-xs px-2 py-1'">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            Examples
          </button>
          <button @click="openTemplateModal('playground', $event)" title="Browse all examples"
                  class="text-xs px-1.5 py-1 rounded bg-surface-700/70 hover:bg-surface-600 text-slate-500 hover:text-slate-300 border border-surface-600 transition-colors ml-0.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
          </button>
          <!-- Dropdown -->
          <div x-show="showTemplates === 'playground'" @click.away="showTemplates = null"
               x-transition class="absolute right-0 top-8 z-50 w-72 bg-surface-800 border border-surface-600 rounded-xl shadow-2xl py-1.5 overflow-hidden max-h-80 overflow-y-auto">
            <p class="px-3 py-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-surface-700">Sample prompts</p>
            <template x-for="tpl in PROMPT_TEMPLATES.playground" :key="tpl.label">
              <div class="px-3 py-2 hover:bg-surface-700 group/tpl">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium text-slate-200" x-text="tpl.icon + ' ' + tpl.label"></p>
                    <p class="text-xs text-slate-500 mt-0.5 truncate" x-text="tpl.hint"></p>
                  </div>
                  <button @click="usePromptTemplate('playground', tpl, $event)"
                          class="flex-shrink-0 text-xs px-2 py-0.5 rounded bg-brand-700/60 hover:bg-brand-600 text-brand-300 border border-brand-700/50 transition-colors opacity-0 group-hover/tpl:opacity-100">Use</button>
                </div>
              </div>
            </template>
          </div>
        </div>
        <div x-show="features.playground.status !== 'idle'" class="status-dot" :class="features.playground.status"></div>
      </div>
    </div>
    <p class="text-xs text-slate-400 mb-4">
      Full orchestration via natural language — use AI agents to manage your systems and workflows.
    </p>
    <div x-show="activeFeature === 'playground'" class="space-y-2">
      <textarea x-model="features.playground.params.prompt"
                @input.stop="features.playground.params.prompt = $event.target.value"
                @click.stop :rows="(!focusMode) ? 12 : 6"
                placeholder="Orchestrate workflows or review code in GitHub…"
                class="input-field w-full resize-none"></textarea>
      <label class="flex items-center gap-2 text-xs text-slate-400 cursor-pointer" @click.stop>
        <input type="checkbox" x-model="generateDiagram"
               class="rounded border-surface-600 bg-surface-800 text-brand-500 focus:ring-brand-500" />
        <span>📊 Generate diagram</span>
      </label>
      <!-- <template x-if="isConnected() && aiProvider === 'copilot' && !hasGhCli()">
        <p class="text-xs text-amber-400/80 text-center py-1">⚠ Custom credential required — add in ☰ Settings</p>
      </template> -->
      <div :class="focusMode ? 'flex items-start gap-3' : 'space-y-2'" @click.stop>
        <div class="flex items-center gap-2" :class="focusMode ? 'flex-1' : ''" @click.stop>
          <label class="text-xs text-slate-500 flex-shrink-0">Model:</label>
          <select x-model="selectedModel" @change="onModelChange()" @click.stop
                  :disabled="modelsLoading || availableModels.length === 0"
                  class="flex-1 text-xs bg-surface-800 border border-surface-600 rounded px-2 py-1 text-slate-300 focus:outline-none focus:ring-1 focus:ring-brand-500 disabled:opacity-50">
            <template x-for="m in availableModels" :key="m.id">
              <option :value="m.id" x-text="m.name + (m.supportsReasoning ? ' 🧠' : '')"></option>
            </template>
          </select>
        </div>
        <!-- Thinking effort — only shown for reasoning models -->
        <div x-show="currentModelSupportsReasoning()" x-transition :class="focusMode ? 'flex-1' : ''" @click.stop>
          <div class="flex items-center gap-1.5">
            <label class="text-xs text-slate-500 flex-shrink-0">Effort:</label>
            <div class="flex gap-1 bg-surface-800 border border-surface-600 rounded px-1 py-0.5 flex-1">
              <template x-for="effort in reasoningEffortOptions()" :key="effort.value">
                <button @click.stop="selectedReasoningEffort = effort.value"
                        :class="selectedReasoningEffort === effort.value ? 'bg-violet-600 text-white' : 'text-slate-400 hover:text-slate-200'"
                        class="flex-1 px-1.5 py-1 text-xs font-medium rounded transition-colors"
                        :title="effort.label" x-text="effort.label"></button>
              </template>
            </div>
          </div>
        </div>
      </div>
      <button @click.stop="runFeature('playground')"
              :disabled="!isConnected() || !features.playground.params.prompt.trim() || features.playground.status === 'loading' /* || (aiProvider === 'copilot' && !hasGhCli()) */"
              class="run-btn w-full">
        <span x-show="features.playground.status !== 'loading'" class="flex items-center justify-center gap-2"><span>▶</span> Run</span>
        <span x-show="features.playground.status === 'loading'" class="flex items-center justify-center gap-2"><span class="spinner"></span> Working…</span>
      </button>
    </div>
  </div>





</div>
