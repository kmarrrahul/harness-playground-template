name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version suffix (e.g., v1.0.0)'
        required: true
        default: 'latest'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  REPO: kmarrrahul/harness-playground-template

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Determine Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi

      - name: Build and Push Combined (multiple-harness)
        run: |
          IMAGE_TAG="${{ env.REPO }}:multiple-harness-${{ env.VERSION }}"
          echo "Building $IMAGE_TAG..."
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Build and Push Individual SDKs
        run: |
          SDKS=("COPILOT" "CLAUDE" "CURSOR" "ANTIGRAVITY" "CODEX")
          
          for TARGET in "${SDKS[@]}"; do
            TAG=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')
            BUILD_ARGS="--build-arg ENABLE_COPILOT=false --build-arg ENABLE_CLAUDE=false --build-arg ENABLE_CURSOR=false --build-arg ENABLE_ANTIGRAVITY=false --build-arg ENABLE_CODEX=false --build-arg ENABLE_${TARGET}=true"
            
            IMAGE_TAG="${{ env.REPO }}:${TAG}-enabled-${{ env.VERSION }}"
            echo "Building $IMAGE_TAG..."
            docker build -t $IMAGE_TAG $BUILD_ARGS .
            docker push $IMAGE_TAG
          done
