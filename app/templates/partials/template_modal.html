<!-- ═══════════════════════════════════════════════════════════════════════
     TEMPLATE PICKER MODAL (maximize button on each card opens this)
══════════════════════════════════════════════════════════════════════════ -->
<div x-show="templateModalFeature !== null"
     @keydown.escape.window="closeTemplateModal()"
     x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-[200] flex items-center justify-center p-4"
     style="background:rgba(0,0,0,0.75); backdrop-filter:blur(4px);">

  <div @click.stop
       x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
       class="w-full max-w-3xl max-h-[85vh] flex flex-col rounded-2xl border border-surface-600 shadow-2xl"
       style="background:#0f1629;">

    <!-- Modal header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-surface-700 flex-shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-lg" x-text="templateModalFeature === 'aws_governance' ? '🛡️' : templateModalFeature === 'k8s_ops' ? '☸️' : templateModalFeature === 'iac_generator' ? '🏗️' : '🎮'"></span>
        <div>
          <h2 class="font-semibold text-white text-sm"
              x-text="templateModalFeature ? (FEATURE_LABELS[templateModalFeature] || templateModalFeature) : ''"></h2>
          <p class="text-xs text-slate-500">Choose a sample prompt — you can edit it before running</p>
        </div>
      </div>
      <button @click="closeTemplateModal()"
              class="p-1.5 rounded-lg hover:bg-surface-700 text-slate-400 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Template list (scrollable) -->
    <div class="overflow-y-auto flex-1 py-2">
      <template x-if="templateModalFeature && PROMPT_TEMPLATES[templateModalFeature]">
        <div>
          <template x-for="(tpl, idx) in PROMPT_TEMPLATES[templateModalFeature]" :key="tpl.label">
            <div class="mx-3 my-1.5 rounded-xl border border-surface-700 hover:border-surface-500 bg-surface-800/60 hover:bg-surface-800 transition-colors group/mtpl">
              <div class="px-4 py-3">
                <div class="flex items-start justify-between gap-3 mb-2">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="text-base flex-shrink-0" x-text="tpl.icon"></span>
                    <span class="text-sm font-medium text-slate-100" x-text="tpl.label"></span>
                    <template x-if="tpl.diagram">
                      <span class="text-xs px-1.5 py-0.5 rounded-full bg-violet-900/50 text-violet-400 border border-violet-800/50 flex-shrink-0">📊 diagram</span>
                    </template>
                    <template x-if="tpl.model">
                      <span class="text-xs px-1.5 py-0.5 rounded-full bg-amber-900/50 text-amber-400 border border-amber-800/50 flex-shrink-0" x-text="tpl.model"></span>
                    </template>
                  </div>
                  <button @click="useTemplateFromModal(templateModalFeature, tpl)"
                          class="flex-shrink-0 text-xs px-3 py-1.5 rounded-lg font-medium bg-brand-600 hover:bg-brand-500 text-white transition-colors">
                    Use this
                  </button>
                </div>
                <p class="text-xs text-slate-500 mb-2" x-text="tpl.hint"></p>
                <pre class="text-xs text-slate-400 bg-surface-900/70 rounded-lg px-3 py-2 whitespace-pre-wrap leading-relaxed max-h-56 overflow-y-auto border border-surface-700/50"
                     x-text="tpl.text"></pre>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

  </div>
</div>
