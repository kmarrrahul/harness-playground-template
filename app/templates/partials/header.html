<!-- ═══════════════════════════════════════════════════════════════════════
     HEADER
══════════════════════════════════════════════════════════════════════════ -->
<header class="relative z-20 border-b border-surface-700">
  <div class="header-gradient absolute inset-0 opacity-90"></div>
  <div class="relative z-10 max-w-7xl mx-auto px-6 py-6">
    <div class="flex items-center justify-between">

      <!-- Burger + title -->
      <div class="flex items-center gap-4">
        <button @click="showSettings = !showSettings"
                class="p-2 rounded-lg bg-surface-700/80 hover:bg-surface-600 border border-surface-600 transition-colors flex-shrink-0"
                title="Open Settings">
          <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <div>
          <div class="flex items-center gap-3 mb-0.5">
            <div class="flex gap-1.5">
              <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-orange-600/80 text-white text-xs font-bold shadow-lg">A</span>
              <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-emerald-500/80 text-white text-xs font-bold shadow-lg">T</span>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Harness Playground</h1>
          </div>
          <p class="text-slate-300 text-sm font-semibold" x-text="`Powered by ${aiProvider === 'antigravity' ? 'Google Antigravity' : aiProvider === 'claude' ? 'Claude Agent' : aiProvider === 'cursor' ? 'Cursor' : aiProvider === 'codex' ? 'Codex' : 'GitHub Copilot'} SDK. A playground for agents.`"></p>
        </div>
      </div>

      <!-- Right: model pill + connection status -->
      <div class="flex items-center gap-3 text-sm">
        
        <!-- Theme Selector Dropdown -->
        <div class="relative" x-data="{ showThemeMenu: false }">
          <button @click="showThemeMenu = !showThemeMenu"
                  class="p-1.5 rounded-lg bg-surface-700/80 hover:bg-surface-600 border border-surface-600 transition-colors flex-shrink-0"
                  title="Change Theme">
            <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <!-- Palette Icon -->
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
            </svg>
          </button>
          
          <div x-show="showThemeMenu" @click.away="showThemeMenu = false"
               x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
               x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
               class="absolute right-0 top-10 w-40 bg-surface-800 border border-surface-600 rounded-lg shadow-xl z-50 py-1 overflow-hidden">
            <template x-for="theme in themes" :key="theme.id">
              <button @click="setTheme(theme.id); showThemeMenu = false;"
                      class="w-full text-left px-3 py-2 text-sm transition-colors flex items-center justify-between"
                      :class="currentTheme === theme.id ? 'bg-brand-600 text-white' : 'text-slate-300 hover:bg-surface-700 hover:text-white'">
                <span x-text="theme.name"></span>
                <svg x-show="currentTheme === theme.id" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              </button>
            </template>
          </div>
        </div>

        <!-- Manage Skills Button -->
        <button @click="openSkillsModal()" 
                class="hidden sm:inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium shadow-md transition-all cursor-pointer border border-brand-500 whitespace-nowrap"
                title="Manage Agent Skills">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
          </svg>
          Manage Skills (<span x-text="enabledSkills.length"></span>)
        </button>

        <!-- Active model badge -->
        <span class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-700/80 border border-surface-600 text-xs text-slate-300">
          <svg class="w-3 h-3 text-brand-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M13 7H7v6h6V7z"/>
            <path fill-rule="evenodd" d="M10 2a8 8 0 100 16A8 8 0 0010 2zM2 10a8 8 0 1116 0A8 8 0 012 10z" clip-rule="evenodd"/>
          </svg>
          <span x-text="selectedModel"></span>
        </span>

        <!-- Connection status - Copilot (GitHub) connected -->
        <template x-if="aiProvider === 'copilot' && isConnected()">
          <div class="relative" x-data="{ showUserMenu: false }">
            <button @click="showUserMenu = !showUserMenu"
                    class="flex items-center gap-2 bg-green-900/40 text-green-400 border border-green-700/40 px-3 py-1.5 rounded-full cursor-pointer hover:bg-green-900/60 transition-colors">
              <template x-if="authMethod === 'oauth' && oauthUser?.avatar_url">
                <img :src="oauthUser.avatar_url" class="w-4 h-4 rounded-full" alt="" referrerpolicy="no-referrer" />
              </template>
              <template x-if="!(authMethod === 'oauth' && oauthUser?.avatar_url)">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse-fast"></span>
              </template>
              <span x-text="authMethod === 'oauth' && oauthUser ? '@' + oauthUser.login : 'Copilot'"></span>
              <svg class="w-3 h-3 text-green-400/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <!-- Dropdown menu -->
            <div x-show="showUserMenu" @click.away="showUserMenu = false"
                 x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                 class="fixed w-44 bg-surface-800 border border-surface-600 rounded-lg shadow-xl z-50 py-1"
                 style="right: 24px; top: 72px;">
              <div class="px-3 py-2 border-b border-surface-700">
                <p class="text-xs text-slate-400" x-text="authMethod === 'oauth' ? 'Signed in via GitHub' : 'Signed in via PAT'"></p>
              </div>
              <button @click="clearToken(); showUserMenu = false;"
                      class="w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-surface-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sign out
              </button>
            </div>
          </div>
        </template>

        <!-- Connection status - Antigravity connected -->
        <template x-if="aiProvider === 'antigravity' && antigravityConnected">
          <div class="relative" x-data="{ showUserMenu: false }">
            <button @click="showUserMenu = !showUserMenu"
                    class="flex items-center gap-2 bg-green-900/40 text-green-400 border border-green-700/40 px-3 py-1.5 rounded-full cursor-pointer hover:bg-green-900/60 transition-colors">
              <!-- Google G icon -->
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              <span x-text="antigravityValidation?.user ? antigravityValidation.user.split('(')[0].trim() : 'Antigravity'"></span>
              <svg class="w-3 h-3 text-green-400/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <!-- Dropdown menu -->
            <div x-show="showUserMenu" @click.away="showUserMenu = false"
                 x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                 class="fixed w-48 bg-surface-800 border border-surface-600 rounded-lg shadow-xl z-50 py-1"
                 style="right: 24px; top: 72px;">
              <div class="px-3 py-2 border-b border-surface-700">
                <p class="text-xs text-slate-400">Google Antigravity</p>
                <p class="text-xs text-slate-500 truncate" x-text="antigravityValidation?.user || 'Antigravity API Key'"></p>
              </div>
              <button @click="clearToken(); showUserMenu = false;"
                      class="w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-surface-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sign out
              </button>
            </div>
          </div>
        </template>

        <!-- Connection status - Claude connected -->
        <template x-if="aiProvider === 'claude' && claudeConnected">
          <div class="relative" x-data="{ showUserMenu: false }">
            <button @click="showUserMenu = !showUserMenu"
                    class="flex items-center gap-2 bg-green-900/40 text-green-400 border border-green-700/40 px-3 py-1.5 rounded-full cursor-pointer hover:bg-green-900/60 transition-colors">
              <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse-fast"></span>
              <span x-text="claudeValidation?.user ? claudeValidation.user.split('(')[0].trim() : 'Claude Agent'"></span>
              <svg class="w-3 h-3 text-green-400/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div x-show="showUserMenu" @click.away="showUserMenu = false"
                 x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                 class="fixed w-48 bg-surface-800 border border-surface-600 rounded-lg shadow-xl z-50 py-1"
                 style="right: 24px; top: 72px;">
              <div class="px-3 py-2 border-b border-surface-700">
                <p class="text-xs text-slate-400">Claude Agent</p>
                <p class="text-xs text-slate-500 truncate" x-text="claudeValidation?.user || 'Anthropic API Key'"></p>
              </div>
              <button @click="disconnectClaude(); showUserMenu = false;"
                      class="w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-surface-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sign out
              </button>
            </div>
          </div>
        </template>

        <!-- Connection status - Cursor connected -->
        <template x-if="aiProvider === 'cursor' && cursorConnected">
          <div class="relative" x-data="{ showUserMenu: false }">
            <button @click="showUserMenu = !showUserMenu"
                    class="flex items-center gap-2 bg-green-900/40 text-green-400 border border-green-700/40 px-3 py-1.5 rounded-full cursor-pointer hover:bg-green-900/60 transition-colors">
              <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse-fast"></span>
              <span x-text="cursorValidation?.user ? cursorValidation.user.split('(')[0].trim() : 'Cursor Agent'"></span>
              <svg class="w-3 h-3 text-green-400/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div x-show="showUserMenu" @click.away="showUserMenu = false"
                 x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                 class="fixed w-48 bg-surface-800 border border-surface-600 rounded-lg shadow-xl z-50 py-1"
                 style="right: 24px; top: 72px;">
              <div class="px-3 py-2 border-b border-surface-700">
                <p class="text-xs text-slate-400">Cursor SDK</p>
                <p class="text-xs text-slate-500 truncate" x-text="cursorValidation?.user || 'Cursor API Key'"></p>
              </div>
              <button @click="disconnectCursor(); showUserMenu = false;"
                      class="w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-surface-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sign out
              </button>
            </div>
          </div>
        </template>

        <!-- Connection status - Codex connected -->
        <template x-if="aiProvider === 'codex' && codexConnected">
          <div class="relative" x-data="{ showUserMenu: false }">
            <button @click="showUserMenu = !showUserMenu"
                    class="flex items-center gap-2 bg-green-900/40 text-green-400 border border-green-700/40 px-3 py-1.5 rounded-full cursor-pointer hover:bg-green-900/60 transition-colors">
              <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse-fast"></span>
              <span x-text="codexValidation?.user ? codexValidation.user.split('(')[0].trim() : 'Codex Agent'"></span>
              <svg class="w-3 h-3 text-green-400/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div x-show="showUserMenu" @click.away="showUserMenu = false"
                 x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                 class="fixed w-48 bg-surface-800 border border-surface-600 rounded-lg shadow-xl z-50 py-1"
                 style="right: 24px; top: 72px;">
              <div class="px-3 py-2 border-b border-surface-700">
                <p class="text-xs text-slate-400">Codex SDK</p>
                <p class="text-xs text-slate-500 truncate" x-text="codexValidation?.user || 'Codex API Key'"></p>
              </div>
              <button @click="disconnectCodex(); showUserMenu = false;"
                      class="w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-surface-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sign out
              </button>
            </div>
          </div>
        </template>

        <!-- Chat History download -->
        <template x-if="isConnected() && currentSessionId">
          <button @click="downloadChatHistory()"
                  :disabled="followupLoading || features[activeFeature]?.status === 'loading'"
                  title="Download chat history as Markdown"
                  class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-surface-700/80 hover:bg-surface-600 border border-surface-600 text-xs text-slate-300 hover:text-white transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Chat History
          </button>
        </template>

        <template x-if="!isConnected()">
          <div class="flex items-center gap-2">
            <!-- Copilot provider: show GitHub sign-in button -->
            <template x-if="aiProvider === 'copilot'">
              <div class="flex items-center gap-2">
                <template x-if="oauthAvailable">
                  <button @click="loginWithGitHub()"
                          class="flex items-center gap-2 px-3 py-1.5 bg-[#24292f] hover:bg-[#32383f] text-white text-xs font-medium rounded-full border border-slate-600 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    Sign in with GitHub
                  </button>
                </template>
                <template x-if="!oauthAvailable">
                  <button @click="showSettings = true"
                          class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-full border border-slate-600 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    Connect via PAT
                  </button>
                </template>
              </div>
            </template>
            <!-- Antigravity provider: show Gemini key prompt -->
            <template x-if="aiProvider === 'antigravity'">
              <button @click="showSettings = true"
                      class="flex items-center gap-2 px-3 py-1.5 bg-blue-900/40 hover:bg-blue-900/60 text-blue-300 text-xs font-medium rounded-full border border-blue-700/50 transition-colors">
                <!-- Google G icon -->
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Add Gemini API Key
              </button>
            </template>
            <!-- Claude provider: show Anthropic key prompt -->
            <template x-if="aiProvider === 'claude'">
              <button @click="showSettings = true"

            <!-- Codex provider: show Codex key prompt -->

          </div>
        </template>
      </div>

    </div>
  </div>
